name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @eddyq/queue build:debug
      - run: pnpm -r build
      # Minimal Node-level wires-up checks against the postgres service.
      # Each script connects with EDDYQ_DATABASE_URL, runs migrate()
      # idempotently, exercises the public surface, and exits non-zero on
      # failure. The fuller `pnpm smoke` suite stays as a local/pre-publish
      # check (run via `just smoke`); CI runs only the fast subset.
      - run: pnpm --filter @eddyq/queue test
        env:
          EDDYQ_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm --filter @eddyq/nestjs test
        env:
          EDDYQ_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # @eddyq/nestjs peers on Nest ^10 || ^11 || ^12. Dev deps pin 12 (covered
      # above); swap in each older major, rebuild, and re-run the smoke. Runs
      # last because `pnpm add` rewrites the manifests.
      - name: nestjs smoke on older Nest majors
        env:
          EDDYQ_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          for v in 10 11; do
            echo "::group::NestJS $v"
            pnpm --filter @eddyq/nestjs --filter @eddyq/wakeboard add -D "@nestjs/common@^$v" "@nestjs/core@^$v"
            pnpm --filter @eddyq/nestjs --filter @eddyq/wakeboard build
            pnpm --filter @eddyq/nestjs test
            echo "::endgroup::"
          done
